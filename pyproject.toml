[build-system]
# extensions built against numpy 2 are compatible with numpy 1.x at runtime
requires = ["setuptools >= 61.0.0", "numpy >= 2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beat"
version = "2.0.5"
requires-python = ">=3.11"
license = {text = "GPLv3"}
description = "'Bayesian Earthquake Analysis Tool'"
readme = "README.md"
authors = [
  {name = "Hannes Vasyura-Bathke", email = "vasbath@gfz-potsdam.de"}
]
maintainers = [
  {name = "Hannes Vasyura-Bathke", email = "vasbath@gfz-potsdam.de"}
]
keywords = ["Bayesian Inference", "seismology", "geodesy", "earthquake", "volcano"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Operating System :: POSIX",
    "Operating System :: MacOS"
]
dependencies = [
    "numpy",
    "scipy",
    "pytensor>=2.18.4",
    "pymc>=5.10.0,<=5.16.2",
    "tqdm>=4.64.0",
    "matplotlib>=3.1.1,<=3.9.0",
    "psutil>=5.9.0",
    "pyrocko>=2023.10.11"
]

[project.urls]
Home = "https://pyrocko.org/beat"
GitHub = "https://github.com/hvasbath/beat"
Issues = "https://github.com/hvasbath/beat/issues"

[project.optional-dependencies]
formatting = ["ruff", "pre-commit"]
test = ["pytest>=7.0", "pytest-cov", "pytest-timeout"]
mpi = ["mpi4py"]
# kite imports pkg_resources, which was removed with setuptools 81
kite = ["kite", "setuptools<81"]
bem = ["pygmsh", "cutde"]

[project.scripts]
beat = "beat.apps.beat:main"
beatdown = "beat.apps.beatdown:main"

[tool.setuptools.package-data]
beat = ["*.jpg", "*.png"]

[tool.setuptools]
packages=[
    "beat",
    "beat.fast_sweeping",
    "beat.voronoi",
    "beat.sampler",
    "beat.models",
    "beat.plotting",
    "beat.ffi",
    "beat.bem",
    "beat.apps"
]

[tool.ruff.lint]
# the rule selection of the former ruff default, newer ruff versions select
# more rules by default
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
addopts = ["-ra", "--strict-markers"]
timeout = 900
markers = [
    "slow: long running test (deselect with '-m \"not slow\"')",
    "mpi: needs mpi4py and an MPI installation (mpiexec)",
    "gmt: needs GMT installed",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyrocko.*",
]

[tool.coverage.run]
source = ["beat"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
build-frontend = "build"
# the compiled extensions only depend on numpy
test-command = 'python -c "import fast_sweep_ext, voronoi_ext"'
# The pinned dependencies (pymc<=5.16.2 -> pytensor 2.25) are not installable
# on Python 3.13, see also the tests workflow.
test-skip = "cp313-*"

[tool.cibuildwheel.linux]
# glibc 2.28: Ubuntu 22.04 and newer
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# macOS 13 (Ventura, 2022) and newer
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }
