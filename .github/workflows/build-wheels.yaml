name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 (glibc 2.28), i.e. Ubuntu 22.04 and newer
          - name: linux-x86_64
            os: ubuntu-24.04
            archs: x86_64
          # macOS 13 and newer (MACOSX_DEPLOYMENT_TARGET in pyproject.toml),
          # x86_64 is cross-compiled and tested with Rosetta 2
          - name: macos-arm64
            os: macos-14
            archs: arm64
          - name: macos-x86_64
            os: macos-14
            archs: x86_64

    steps:
      - uses: actions/checkout@v7

      # Python versions and further options in [tool.cibuildwheel] of
      # pyproject.toml
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-24.04
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
